<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        section{
           
        }
        .contenedorfijo{
            border: 2px solid;
            width: 600px;
             margin-top: 100px;
            margin-left: auto;
            margin-right: auto;
            overflow: hidden;
        }
        li{
            width: 800px;
            background-color: blue;
            list-style: none;
        }
        .contenedordesplazable{
            display: flex;
            width: 2400px;
            height: 400px;
            animation-name: mover;
            animation-duration: 20s;
            animation-delay: 3s;
                        
        }

        @keyframes mover {
            0%{transform: translateX(0);}
            25%{transform: translateX(-400px);}
            75%{transform: translateX(-800px);}
            100%{transform: translateX(-1200px);}
        }
        #i1{
            background-color: rgb(255, 0, 0);
        }
        #i2{
            background-color: rgb(140, 91, 185);
        }
        #i3{
            background-color: rgb(245, 171, 60);
        
    </style>
</head>
<body>
   <section>
        <div class="contenedorfijo">
            <ul class="contenedordesplazable">
                <li id="i1">imagen1</li>
                <li id="i2">imagen2</li>
                <li id="i3">imagen3</li>
                <li id="i4">imagen4</li>
            </ul>
        </div>

   </section> 
</body>
</html>
